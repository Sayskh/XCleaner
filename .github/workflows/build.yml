name: Build and Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Bundles
        run: node build.js

      - name: Verify Dist Artifacts
        run: |
          test -f dist/extension/manifest.json
          test -f dist/extension/content.js
          test -f dist/xcleaner.user.js
