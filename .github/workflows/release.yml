name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bundles
        run: node build.js

      - name: Package extension
        run: cd dist/extension && zip -r ../XCleaner-extension.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XCleaner-extension.zip
            dist/xcleaner.user.js
          generate_release_notes: false
          body: |
            Download `XCleaner-extension.zip`, extract it, then load the folder in your browser.
            Or install `xcleaner.user.js` with Tampermonkey / Violentmonkey.
