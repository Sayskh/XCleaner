name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bundles
        run: node build.js

      - name: Package extension
        run: |
          cd dist/extension
          zip -r ../XCleaner-extension.zip .
          cp ../XCleaner-extension.zip ../XCleaner.xpi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XCleaner-extension.zip
            dist/XCleaner.xpi
            dist/xcleaner.user.js
          generate_release_notes: false
          body: |
            Chrome / Edge / Brave: extract `XCleaner-extension.zip`, then Load unpacked.
            Firefox: `about:debugging` -> Load Temporary Add-on -> `XCleaner.xpi`.
            Any browser: `xcleaner.user.js` with Tampermonkey / Violentmonkey (auto-updates).
